openapi: 3.0.0
info:
  title: SRGSSR Audio
  description: >
    This API provides Audio Metadata (incl. subtitles) from RSI, RTS, RTS, SRF, SWI.
  contact:
    name: API Developer
    url: https://developer.srgssr.ch
    email: api@srgssr.ch
  version: '2.0.5'
servers:
- url: https://api.srgssr.ch/audiometadata/v2
  variables: {}
- url: https://srgssr-prod.apigee.net/oauth/v1
  variables: {}
paths:
  /audios/search:
    get:
      tags:
      - Audios
      summary: audiosSearch
      description: Returns the audio search result matching the given search criteria. The service returns valid audioId(s) that can be used for other services/APIs requiring an audioId
      operationId: audiosSearch
      parameters:
      - name: bu
        in: query
        description: Business unit
        required: true
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/bu'
          - description: Business unit
      - name: q
        in: query
        description: Term (string search on audio title) that should be searched for
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: accept
        in: header
        description: ''
        style: simple
        schema:
          allOf:
          - $ref: '#/components/schemas/accept'
          - {}
      - name: callback
        in: query
        description: If this parameter is set, the result will be returned as [JSONP](https://en.wikipedia.org/wiki/JSONP). The given value will be used as the name of the method to be called.
        style: form
        explode: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of items that should be returned per page. Only supported on the request to the first page!
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: next
        in: query
        description: Encoded reference to the next page. Clients must not assemble this at their own but just use the next-link provided as part of the payload of every response.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Object of type SearchResultListMedia.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/SearchResultListMedia'
                - xml:
                    name: SearchResultListMedia
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SearchResultListMedia'
        '203':
          description: The returned object is the same as in a 200 response, but some non-mandatory values may be missing.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/SearchResultListMedia'
                - xml:
                    name: SearchResultListMedia
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SearchResultListMedia'
        '400':
          description: Object of type BadRequest.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/BadRequest'
                - xml:
                    name: BadRequest
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Object of type TokenError
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/TokenError'
                - xml:
                    name: TokenError
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/TokenError'
        '403':
          description: Object of type QuotaViolation.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/QuotaViolation'
                - xml:
                    name: QuotaViolation
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/QuotaViolation'
        '404':
          description: Object of type UnknownResource.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/UnknownResource'
                - xml:
                    name: UnknownResource
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/UnknownResource'
        '405':
          description: Object of type MethodNotAllowed.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/MethodNotAllowed'
                - xml:
                    name: MethodNotAllowed
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/Status'
                - xml:
                    name: Status
                    attribute: false
                    wrapped: false
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Status'
      deprecated: false
      security:
      - srg_auth: []
