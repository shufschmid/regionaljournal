tags:
- name: Audios
  description: Services related to Audios. The service returns valid audioIds that can be used for other services/APIs requiring an audioId
- name: Livestreams
  description: Services returning Audio Livestream objects. This service returns valid livesteamIds with other metadata information. When requested by livestreamId, it returns metadata for the given livestreamId
- name: RadioChannels
  description: Services returning Radio Channel objects. The service returns list of radio channelIds. When requested by channelId, it returns currently playing and upcoming episode
- name: RadioShows
  description: Services returning Radio Show objects with related information. When requested by showId, it returns show metadata for the given showId
- name: Episodes
  description: Services returning audio Episode objects. The service returns full-length audios for a selected date and a selected channel filtered by an editorially managed list of shows
- name: EpisodeComposition
  description: Services returning Radio Show EpisodeComposition objects. The service returns the latest episodes with a list of media for the given show. Only episodes with playable media are returned by this service
- name: MediaComposition
  description: Services returning Audio MediaComposition objects. The service returns detailed metatdata for an audio. On the chapter section, there are information to play the audio
- name: SongList
  description: ''
